# Reverse proxy in front of Keycloak for the OpenID provider conformance tests. It adds what FAPI requires of resource
# server responses, which Keycloak's userinfo endpoint, used as the resource endpoint, does not send:
# - the Date header, which nginx adds to every response
# - the x-fapi-interaction-id header, echoing the client's value or generating one
# It also forwards the TLS client certificate for certificate bound access tokens, which Keycloak reads with its nginx
# x509cert-lookup provider.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # The x-fapi-interaction-id the client sent, otherwise a generated UUID
    map $request_id $generated_interaction_id {
        "~^(?<p1>.{8})(?<p2>.{4})(?<p3>.{4})(?<p4>.{4})(?<p5>.{12})$" "$p1-$p2-$p3-$p4-$p5";
    }
    map $http_x_fapi_interaction_id $fapi_interaction_id {
        ""      $generated_interaction_id;
        default $http_x_fapi_interaction_id;
    }

    # The BCP195 settings FAPI requires, as the suite checks the TLS of the endpoints it calls
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_certificate     /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    # Request objects and Keycloak's cookies make for large headers
    large_client_header_buffers 4 64k;
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;
    client_max_body_size 10m;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_http_version 1.1;
    proxy_ssl_verify off;

    # Each location forwards the client's Host header, as Keycloak checks the URL of a DPoP proof against the URL of the
    # request, which it takes from the Host header, and the client certificate
    server {
        listen 8443 ssl;

        # Keycloak verifies the forwarded certificate against its truststore
        ssl_verify_client optional_no_ca;

        location / {
            # Keycloak runs on the Docker host, reached through the Testcontainers host tunnel
            proxy_pass https://host.testcontainers.internal:8443;
            proxy_set_header Host $http_host;
            proxy_set_header ssl-client-cert $ssl_client_escaped_cert;
        }

        location ~ /protocol/openid-connect/userinfo$ {
            proxy_pass https://host.testcontainers.internal:8443;
            proxy_set_header Host $http_host;
            proxy_set_header ssl-client-cert $ssl_client_escaped_cert;
            add_header x-fapi-interaction-id $fapi_interaction_id always;
        }
    }
}
